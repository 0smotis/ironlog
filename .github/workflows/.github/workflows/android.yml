# Builds the IronLog Android app and publishes it as a GitHub release (Obtainium picks it up).
# Runs only when the Android app itself changes; page-only changes (www/) reach phones as live updates.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm ci

      - name: Copy the page into the Android project
        run: npx cap sync android

      - name: Unpack signing key
        env:
          KS: ${{ secrets.IRONLOG_KEYSTORE_BASE64 }}
          PW: ${{ secrets.IRONLOG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the IRONLOG_KEYSTORE_BASE64 and IRONLOG_KEYSTORE_PASSWORD secrets under Settings > Secrets and variables > Actions, then re-run this build."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ironlog.p12"

      - name: Build signed APK
        working-directory: android
        env:
          IRONLOG_KEYSTORE: ${{ runner.temp }}/ironlog.p12
          IRONLOG_KEYSTORE_PASSWORD: ${{ secrets.IRONLOG_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.3.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "IronLog-$V.apk"
          gh release create "v$V" "IronLog-$V.apk" \
            --title "IronLog $V" \
            --notes "Android app built from ${GITHUB_SHA::7}. Install or update with Obtainium (add https://github.com/${{ github.repository }}). Page changes don't need a new release — they reach the app on their own."
